<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lacoste main</title>
    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="./styles/common.css">
    <link rel="stylesheet" href="./styles/index.css">
    <script src="./scripts/index.js" defer></script>
    <script src="./scripts/common.js" defer></script>
</head>

<body>
    <div id="allWrap"><!-- s : 전체묶음 -->
        <header>
            <div class="top_banner"> <!--s : top bnr-->
                <p>SS25 시즌오프 진행 중! up to 30% off | 정상가 상품 최대 10% 할인</p>
                <button class="banner_close">✕</button>
            </div><!--e : top bnr-->
            <!-- s: gnb 시작 -->
            <nav class="gnb_wrap"> <!-- s : nav 전체 묶음 (로고, 메뉴 카테고리, 아이콘)-->
                <div class="gnb_left"><!-- s : 로고-->
                    <h1 class="logo">
                        <a href="#"><img src="./images/logo/logo.png" alt="logo"></a>
                    </h1>
                </div><!-- e : 로고-->
                <div class="gnb_center"> <!-- s: 메뉴카테고리 묶음-->
                    <ul class="gnb_menu"> <!-- s: 메뉴카테고리(men,women,kids,sale,discover)-->
                        <li data-menu="men">
                            <button class="gnb_btn">MEN</button>
                        </li>
                        <li data-menu="women">
                            <button class="gnb_btn">WOMEN</button>
                        </li>
                        <li data-menu="kids">
                            <button class="gnb_btn">KIDS</button>
                        </li>
                        <li data-menu="sale">
                            <button class="gnb_btn">SALE</button>
                        </li>
                        <li data-menu="discover">
                            <button class="gnb_btn">DISCOVER</button>
                        </li>
                    </ul>
                </div><!-- e: 메뉴카테고리 묶음(men,women,kids,sale,discover)-->
                <div class="lnb_wrap"><!-- s : lnb 전체묶음-->
                    <div class="lnb" data-menu="men"><!-- s : lnb 왼,오른쪽 내용 전체묶음-->
                        <div class="lnb_inner"> <!-- s : lnb 내용-->
                            <div class="lnb_left"><!-- s : lnb 왼쪽 내용-->
                                <ul class="lnb_feature">
                                    <li><a href="#">신제품</a></li>
                                    <li><a href="#">베스트 셀러</a></li>
                                    <li><a href="#">2026 겨울 룩북</a></li>
                                </ul>
                                <a href="#" class="lnb_discover">DISCOVER</a> <!--discover 박스모양-->
                            </div><!-- e : lnb 왼쪽 내용-->
                        </div><!-- e : lnb 내용-->
                    </div><!-- e : lnb 왼,오른쪽 내용 전체묶음-->
                </div><!-- e : lnb 전체묶음-->
            </nav><!-- e : nav 전체 묶음 (로고, 메뉴 카테고리, 아이콘 )-->
        </header>
        <!-- e: gnb -->
    </div><!-- e : 전체묶음 -->
</body>

</html>
